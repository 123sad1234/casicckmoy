<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Riyaz Drop — Case Opening & Skins</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary:#0b0b10;--bg-secondary:#12121a;--bg-card:rgba(18,18,28,0.85);--bg-glass:rgba(255,255,255,0.03);
  --border-glass:rgba(255,255,255,0.06);--text-primary:#fff;--text-secondary:#8a8a9a;--text-muted:#555560;
  --accent-cyan:#00e5ff;--accent-purple:#b24bff;--accent-pink:#ff2d95;--accent-gold:#ffc800;--accent-green:#00e676;
  --accent-red:#ff3d3d;--accent-orange:#ff9100;
  --r-consumer:#b0b0b0;--r-industrial:#6496e1;--r-military:#4b69cd;--r-restricted:#8847ff;--r-classified:#d32ce6;
  --r-covert:#eb4b4b;--r-contraband:#ffae00;--r-rare:#ffd700;
  --font-display:'Orbitron',monospace;--font-skin:'Rajdhani',sans-serif;--font-body:'Inter',sans-serif;
  --transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
}
* { margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body { font-family:var(--font-body);background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden; }
::-webkit-scrollbar { width:5px; } ::-webkit-scrollbar-track { background:var(--bg-primary); } ::-webkit-scrollbar-thumb { background:var(--accent-purple);border-radius:3px; }

/* Particles */
#particles-canvas { position:fixed;inset:0;pointer-events:none;z-index:0; }
#app { position:relative;z-index:1;min-height:100vh; }

/* Landing */
.landing-page { min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,rgba(178,75,255,0.08),transparent 60%),radial-gradient(ellipse at bottom,rgba(255,45,149,0.06),transparent 60%),var(--bg-primary);position:relative;overflow:hidden; }
.landing-hero { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;position:relative; }
.landing-hero::before { content:'';position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:700px;height:500px;background:radial-gradient(ellipse,rgba(178,75,255,0.12),transparent 70%);animation:heroPulse 5s ease-in-out infinite; }
@keyframes heroPulse { 0%,100%{opacity:0.4;transform:translate(-50%,-50%) scale(1);} 50%{opacity:1;transform:translate(-50%,-50%) scale(1.08);} }
.landing-logo { font-family:var(--font-display);font-size:clamp(2.8rem,9vw,5.5rem);font-weight:900;letter-spacing:6px;background:linear-gradient(135deg,#fff 0%,var(--accent-cyan) 30%,var(--accent-purple) 70%,var(--accent-pink) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:0 0 60px rgba(178,75,255,0.3); }
.landing-sub { font-family:var(--font-skin);font-size:clamp(1rem,2.5vw,1.4rem);color:var(--text-secondary);margin:0.5rem 0 2rem;letter-spacing:2px;text-transform:uppercase; }
.landing-btn { font-family:var(--font-display);font-size:1.1rem;font-weight:700;padding:1rem 3.5rem;border:none;border-radius:14px;background:linear-gradient(135deg,var(--accent-purple),var(--accent-pink));color:#fff;cursor:pointer;position:relative;overflow:hidden;transition:var(--transition);box-shadow:0 0 40px rgba(178,75,255,0.35);text-transform:uppercase;letter-spacing:3px; }
.landing-btn:hover { transform:translateY(-3px);box-shadow:0 0 60px rgba(178,75,255,0.55); }
.landing-btn::after { content:'';position:absolute;top:-50%;left:-60%;width:200%;height:200%;background:linear-gradient(45deg,transparent,rgba(255,255,255,0.12),transparent);transform:rotate(35deg);transition:0.6s; }
.landing-btn:hover::after { left:100%; }
.landing-features { display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;padding:1.5rem;max-width:1000px;width:100%;margin:0 auto; }
.landing-feature { background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:16px;padding:1.25rem;text-align:center;backdrop-filter:blur(12px);transition:var(--transition); }
.landing-feature:hover { transform:translateY(-6px);border-color:rgba(178,75,255,0.3);box-shadow:0 10px 30px rgba(178,75,255,0.15); }
.landing-feature-icon { font-size:2.2rem;margin-bottom:0.4rem; }
.landing-feature h3 { font-family:var(--font-display);font-size:0.8rem;letter-spacing:1px;margin-bottom:0.2rem; }
.landing-feature p { font-size:0.75rem;color:var(--text-secondary); }
.landing-lb { background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:16px;padding:1.5rem;margin:1rem auto 2rem;max-width:480px;width:calc(100% - 3rem);backdrop-filter:blur(12px); }
.landing-lb h3 { font-family:var(--font-display);text-align:center;margin-bottom:1rem;color:var(--accent-gold);letter-spacing:2px;font-size:0.9rem; }

/* Main App */
.main-app { display:none;min-height:100vh; }
.main-app.active { display:block; }
.app-header { position:sticky;top:0;z-index:100;background:rgba(11,11,16,0.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border-glass);padding:0.6rem 1rem; }
.header-content { max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem; }
.header-logo { font-family:var(--font-display);font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,#fff,var(--accent-cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;letter-spacing:2px; }
.header-balance { display:flex;align-items:center;gap:0.4rem;background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:50px;padding:0.35rem 1rem;font-family:var(--font-display);font-weight:600;font-size:0.9rem; }
.header-user { display:flex;align-items:center;gap:0.6rem;cursor:pointer;padding:0.25rem 0.7rem;border-radius:50px;transition:var(--transition); }
.header-user:hover { background:var(--bg-glass); }
.header-avatar { width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent-purple),var(--accent-pink));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8rem; }
.header-level { font-size:0.65rem;color:var(--accent-gold);font-family:var(--font-display); }

.bottom-nav { position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(11,11,16,0.95);backdrop-filter:blur(24px);border-top:1px solid var(--border-glass);display:flex;justify-content:space-around;padding:0.4rem 0; }
.bottom-nav-item { display:flex;flex-direction:column;align-items:center;gap:0.15rem;padding:0.25rem 0.6rem;border-radius:10px;cursor:pointer;transition:var(--transition);color:var(--text-muted);font-size:0.6rem;border:none;background:none;font-family:var(--font-body); }
.bottom-nav-item.active { color:var(--accent-cyan);background:rgba(0,229,255,0.08); }
.bottom-nav-item svg { width:22px;height:22px; }

.desktop-sidebar { display:none;position:fixed;left:0;top:56px;bottom:0;width:230px;background:rgba(11,11,16,0.96);backdrop-filter:blur(24px);border-right:1px solid var(--border-glass);padding:0.75rem 0.4rem;z-index:99;overflow-y:auto; }
.sidebar-item { display:flex;align-items:center;gap:0.6rem;padding:0.65rem 0.9rem;border-radius:10px;cursor:pointer;transition:var(--transition);color:var(--text-secondary);margin-bottom:0.15rem;border:none;background:none;width:100%;font-family:var(--font-body);font-size:0.85rem; }
.sidebar-item:hover,.sidebar-item.active { background:var(--bg-glass);color:var(--text-primary); }
.sidebar-item.active { border-left:3px solid var(--accent-cyan);background:rgba(0,229,255,0.04); }
.sidebar-item svg { width:18px;height:18px;flex-shrink:0; }

.main-content { padding:1rem;padding-bottom:80px;max-width:1400px;margin:0 auto; }
@media(min-width:1024px){ .desktop-sidebar{display:block;} .bottom-nav{display:none;} .main-content{margin-left:230px;padding:1.5rem;padding-bottom:1.5rem;} }

/* Cards */
.card { background:var(--bg-card);border:1px solid var(--border-glass);border-radius:16px;padding:1.25rem;backdrop-filter:blur(10px);transition:var(--transition); }
.card:hover { border-color:rgba(255,255,255,0.1); }
.card-title { font-family:var(--font-display);font-size:0.9rem;margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem;letter-spacing:1px; }
.section-title { font-family:var(--font-display);font-size:clamp(1.1rem,3vw,1.6rem);margin-bottom:1.25rem;background:linear-gradient(135deg,#fff,var(--text-secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px; }
.btn { font-family:var(--font-body);font-weight:600;padding:0.65rem 1.25rem;border:none;border-radius:10px;cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;justify-content:center;gap:0.4rem;font-size:0.85rem; }
.btn-primary { background:linear-gradient(135deg,var(--accent-purple),var(--accent-pink));color:#fff;box-shadow:0 4px 15px rgba(178,75,255,0.25); }
.btn-primary:hover { transform:translateY(-2px);box-shadow:0 6px 25px rgba(178,75,255,0.45); }
.btn-secondary { background:var(--bg-glass);border:1px solid var(--border-glass);color:var(--text-primary); }
.btn-secondary:hover { background:rgba(255,255,255,0.04);border-color:var(--accent-purple); }
.btn-success { background:linear-gradient(135deg,var(--accent-green),#00c853);color:#fff; }
.btn-danger { background:linear-gradient(135deg,var(--accent-red),#d50000);color:#fff; }
.btn:disabled { opacity:0.4;cursor:not-allowed;transform:none!important; }
.grid-2 { display:grid;grid-template-columns:repeat(2,1fr);gap:1rem; }
.grid-3 { display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem; }
.grid-4 { display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem; }
@media(max-width:640px){ .grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-4{grid-template-columns:repeat(2,1fr);} }

/* Home */
.home-hero { background:linear-gradient(135deg,rgba(178,75,255,0.06),rgba(255,45,149,0.04));border:1px solid var(--border-glass);border-radius:20px;padding:1.75rem;margin-bottom:1.25rem;position:relative;overflow:hidden; }
.home-hero h1 { font-family:var(--font-display);font-size:clamp(1.3rem,4vw,2.2rem);margin-bottom:0.4rem; }
.home-hero p { color:var(--text-secondary);margin-bottom:1.25rem;font-size:0.9rem; }
.stats-row { display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0.75rem;margin-bottom:1.25rem; }
.stat-card { background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:12px;padding:0.875rem;text-align:center;transition:var(--transition); }
.stat-card:hover { border-color:var(--accent-cyan);box-shadow:0 0 20px rgba(0,229,255,0.1); }
.stat-value { font-family:var(--font-display);font-size:1.3rem;font-weight:700;color:var(--accent-cyan); }
.stat-label { font-size:0.7rem;color:var(--text-secondary);margin-top:0.2rem;text-transform:uppercase;letter-spacing:1px; }
.game-modes-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0.875rem;margin-bottom:1.25rem; }
.game-mode-card { background:var(--bg-card);border:1px solid var(--border-glass);border-radius:16px;padding:1.25rem;cursor:pointer;transition:var(--transition);position:relative;overflow:hidden; }
.game-mode-card::before { content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent-cyan),var(--accent-purple));opacity:0;transition:opacity 0.3s; }
.game-mode-card:hover::before { opacity:1; }
.game-mode-card:hover { transform:translateY(-4px);border-color:var(--accent-purple);box-shadow:0 8px 30px rgba(178,75,255,0.15); }
.game-mode-icon { font-size:2.2rem;margin-bottom:0.6rem; }
.game-mode-title { font-family:var(--font-display);font-size:1rem;margin-bottom:0.25rem; }
.game-mode-desc { font-size:0.8rem;color:var(--text-secondary);margin-bottom:0.875rem; }
.game-mode-btn { width:100%;padding:0.55rem;border-radius:8px;border:1px solid var(--accent-purple);background:transparent;color:var(--accent-purple);font-weight:600;cursor:pointer;transition:var(--transition);font-family:var(--font-body);font-size:0.8rem; }
.game-mode-card:hover .game-mode-btn { background:var(--accent-purple);color:#fff; }

/* Case Shop */
.case-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem; }
.case-card { background:var(--bg-card);border:1px solid var(--border-glass);border-radius:16px;overflow:hidden;transition:var(--transition);cursor:pointer; }
.case-card:hover { transform:translateY(-4px) scale(1.01);border-color:var(--accent-gold);box-shadow:0 0 25px rgba(255,200,0,0.15); }
.case-image { height:130px;background:linear-gradient(135deg,rgba(178,75,255,0.08),rgba(255,200,0,0.05));display:flex;align-items:center;justify-content:center;font-size:2.5rem;position:relative;overflow:hidden; }
.case-image::after { content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,0.5) 100%); }
.case-info { padding:0.875rem; }
.case-name { font-family:var(--font-display);font-size:0.85rem;margin-bottom:0.25rem;letter-spacing:0.5px; }
.case-price { display:flex;align-items:center;gap:0.25rem;color:var(--accent-gold);font-weight:700;font-family:var(--font-display);margin-bottom:0.6rem;font-size:0.9rem; }
.case-items-preview { display:flex;gap:0.25rem;margin-bottom:0.6rem;flex-wrap:wrap; }
.case-item-dot { width:7px;height:7px;border-radius:50%; }
.case-open-btn { width:100%;padding:0.55rem;border-radius:8px;border:none;background:linear-gradient(135deg,var(--accent-gold),#e6b000);color:#000;font-weight:700;cursor:pointer;transition:var(--transition);font-family:var(--font-display);font-size:0.8rem;letter-spacing:1px; }
.case-open-btn:hover { transform:scale(1.04);box-shadow:0 0 20px rgba(255,200,0,0.3); }

/* Case Modal */
.case-modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(12px);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s; }
.case-modal-overlay.active { opacity:1;pointer-events:all; }
.case-modal { width:100%;max-width:850px;padding:1.5rem;text-align:center; }
.case-roulette-container { position:relative;height:150px;background:rgba(0,0,0,0.4);border:2px solid var(--accent-gold);border-radius:12px;overflow:hidden;margin:1.5rem 0; }
.case-roulette-container::before,.case-roulette-container::after { content:'';position:absolute;top:0;bottom:0;width:70px;z-index:2;pointer-events:none; }
.case-roulette-container::before { left:0;background:linear-gradient(90deg,rgba(0,0,0,0.85),transparent); }
.case-roulette-container::after { right:0;background:linear-gradient(-90deg,rgba(0,0,0,0.85),transparent); }
.case-roulette-center { position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--accent-gold);transform:translateX(-50%);z-index:3;box-shadow:0 0 20px var(--accent-gold); }
.case-roulette-track { display:flex;align-items:center;height:100%;gap:8px;padding:0 50%;will-change:transform; }
.roulette-item { flex-shrink:0;width:110px;height:110px;background:var(--bg-card);border:2px solid;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.8rem;transition:transform 0.2s; }
.roulette-item .skin-name { font-size:0.55rem;margin-top:0.3rem;font-family:var(--font-skin);font-weight:700;text-align:center;padding:0 0.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px; }
.roulette-item .skin-weapon { font-size:0.5rem;color:var(--text-muted);margin-top:0.1rem;font-family:var(--font-skin); }
.case-result { animation:result-pop 0.6s cubic-bezier(0.175,0.885,0.32,1.275); }
@keyframes result-pop { 0%{transform:scale(0) rotate(-8deg);opacity:0;} 100%{transform:scale(1) rotate(0);opacity:1;} }
.glow-consumer { border-color:var(--r-consumer);box-shadow:0 0 12px rgba(176,176,176,0.25); }
.glow-industrial { border-color:var(--r-industrial);box-shadow:0 0 12px rgba(100,150,225,0.25); }
.glow-military { border-color:var(--r-military);box-shadow:0 0 12px rgba(75,105,205,0.25); }
.glow-restricted { border-color:var(--r-restricted);box-shadow:0 0 12px rgba(136,71,255,0.3); }
.glow-classified { border-color:var(--r-classified);box-shadow:0 0 15px rgba(211,44,230,0.35); }
.glow-covert { border-color:var(--r-covert);box-shadow:0 0 18px rgba(235,75,75,0.4); }
.glow-contraband { border-color:var(--r-contraband);box-shadow:0 0 20px rgba(255,174,0,0.45); }
.glow-rare { border-color:var(--r-rare);box-shadow:0 0 22px rgba(255,215,0,0.5); }

/* Inventory */
.inventory-filters { display:flex;gap:0.4rem;margin-bottom:0.875rem;flex-wrap:wrap; }
.filter-btn { padding:0.35rem 0.7rem;border-radius:20px;border:1px solid var(--border-glass);background:var(--bg-glass);color:var(--text-secondary);cursor:pointer;transition:var(--transition);font-size:0.75rem;font-family:var(--font-body); }
.filter-btn.active,.filter-btn:hover { border-color:var(--accent-purple);color:var(--text-primary);background:rgba(178,75,255,0.08); }
.inventory-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.6rem; }
.inv-item { background:var(--bg-card);border:1px solid var(--border-glass);border-radius:12px;padding:0.6rem;text-align:center;cursor:pointer;transition:var(--transition);position:relative; }
.inv-item:hover { transform:translateY(-3px);border-color:rgba(255,255,255,0.12); }
.inv-item.favorite::after { content:'★';position:absolute;top:3px;right:3px;color:var(--accent-gold);font-size:0.7rem; }
.inv-item-icon { font-size:2.2rem;margin-bottom:0.2rem; }
.inv-item-name { font-size:0.7rem;font-weight:600;margin-bottom:0.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-skin); }
.inv-item-weapon { font-size:0.6rem;color:var(--text-muted);margin-bottom:0.15rem;font-family:var(--font-skin); }
.inv-item-rarity { font-size:0.55rem;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;font-family:var(--font-skin); }
.inv-item-value { font-size:0.65rem;color:var(--accent-gold);margin-top:0.15rem;font-family:var(--font-display); }

/* Modal */
.modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(12px);z-index:999;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity 0.3s; }
.modal-overlay.active { opacity:1;pointer-events:all; }
.modal { background:var(--bg-secondary);border:1px solid var(--border-glass);border-radius:20px;padding:1.75rem;max-width:440px;width:100%;position:relative;animation:modal-in 0.3s ease; }
@keyframes modal-in { from{transform:scale(0.9);opacity:0;} to{transform:scale(1);opacity:1;} }
.modal-close { position:absolute;top:0.875rem;right:0.875rem;background:none;border:none;color:var(--text-secondary);font-size:1.4rem;cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:var(--transition); }
.modal-close:hover { background:var(--bg-glass);color:var(--text-primary); }

/* Crash */
.crash-container { background:var(--bg-card);border:1px solid var(--border-glass);border-radius:20px;padding:1.25rem;max-width:680px;margin:0 auto; }
.crash-graph { height:280px;background:rgba(0,0,0,0.35);border-radius:12px;position:relative;overflow:hidden;margin-bottom:1.25rem;border:1px solid var(--border-glass); }
.crash-line { position:absolute;bottom:0;left:0;stroke:var(--accent-green);stroke-width:3;fill:none;filter:drop-shadow(0 0 8px var(--accent-green)); }
.crash-multiplier { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--font-display);font-size:clamp(1.8rem,6vw,3.5rem);font-weight:900;color:var(--accent-green);text-shadow:0 0 30px rgba(0,230,118,0.4);transition:color 0.3s; }
.crash-multiplier.crashed { color:var(--accent-red);text-shadow:0 0 30px rgba(255,61,61,0.4); }
.crash-controls { display:grid;grid-template-columns:1fr 1fr;gap:0.875rem;margin-bottom:0.875rem; }
.crash-input-group { display:flex;flex-direction:column;gap:0.25rem; }
.crash-input-group label { font-size:0.75rem;color:var(--text-secondary);font-family:var(--font-skin);text-transform:uppercase;letter-spacing:1px; }
.crash-input { background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:10px;padding:0.65rem 0.875rem;color:var(--text-primary);font-family:var(--font-display);font-size:0.95rem;outline:none;transition:var(--transition); }
.crash-input:focus { border-color:var(--accent-purple);box-shadow:0 0 10px rgba(178,75,255,0.15); }
.crash-history { display:flex;gap:0.4rem;flex-wrap:wrap;margin-top:0.875rem; }
.crash-history-item { padding:0.25rem 0.5rem;border-radius:6px;font-family:var(--font-display);font-size:0.7rem;font-weight:700; }

function createDefaultUser(nickname) {
  return {
    nickname, id:'RZ-'+Math.random().toString(36).substr(2,6).toUpperCase(),
    avatar:nickname.charAt(0).toUpperCase(), coins:500, stars:0, xp:0, level:1,

    inventory:[], history:[], achievements:[], quests:{daily:[],weekly:[],claimed:[]},
    dailyRewards:{lastClaim:0,streak:0,claimedDays:[]},
    settings:{sound:true,music:false,reducedMotion:false,lang:'ru'},
    equipped:null, promoUsed:[], isAdmin:false
  };
}
function getState(){
  try{
    const r=localStorage.getItem('riyaz_drop_user'); if(!r)return null;
    const parsed=JSON.parse(r);
    // Защита от повреждённых/неполных сохранений: аккуратно достраиваем недостающие поля свежим шаблоном.
    if(!parsed||typeof parsed!=='object'||!parsed.nickname)return null;
    const safeNick=sanitizeNickname(parsed.nickname)||'Player';
    const fresh=createDefaultUser(safeNick);
    const merged={...fresh,...parsed,nickname:safeNick,avatar:safeNick.charAt(0).toUpperCase()};
    merged.stats={...fresh.stats,...(parsed.stats||{})};
    merged.settings={...fresh.settings,...(parsed.settings||{})};
    merged.quests={...fresh.quests,...(parsed.quests||{})};
    merged.dailyRewards={...fresh.dailyRewards,...(parsed.dailyRewards||{})};
    merged.inventory=Array.isArray(parsed.inventory)?parsed.inventory:[];
    merged.history=Array.isArray(parsed.history)?parsed.history:[];
    merged.achievements=Array.isArray(parsed.achievements)?parsed.achievements:[];
    merged.promoUsed=Array.isArray(parsed.promoUsed)?parsed.promoUsed:[];
    return merged;
  }catch(e){ console.warn('Сохранение повреждено, начинаем заново',e); return null; }
}
function saveState(s){
  try{ localStorage.setItem('riyaz_drop_user',JSON.stringify(s)); }
  catch(e){ console.warn('Не удалось сохранить прогресс',e); notify('Ошибка сохранения','Недостаточно места в хранилище браузера','⚠️',4000); }
}
function escapeHtml(str){ return String(str==null?'':str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sanitizeNickname(nick){ return String(nick).replace(/[<>&"'`]/g,'').trim().slice(0,16); }

  if(won)state.stats.wins++; else state.stats.losses++;
  saveState(state); updateHeader();
  checkQuestProgress('games'); checkQuestProgress('wins',won?1:0); checkAchievements();
}

// ===================== AUDIO (реальные звуковые эффекты и фоновой эмбиент) =====================
let audioCtx=null;
function getAudioCtx(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(audioCtx.state==='suspended')audioCtx.resume(); return audioCtx; }
function playTone(freq,duration=0.12,type='sine',vol=0.05){
  if(!state||!state.settings.sound)return;
  const ctx=getAudioCtx(); if(!ctx)return;
  const osc=ctx.createOscillator(); const gain=ctx.createGain();
  osc.type=type; osc.frequency.value=freq; gain.gain.value=vol;
  osc.connect(gain); gain.connect(ctx.destination);
  gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+duration);
  osc.start(); osc.stop(ctx.currentTime+duration);
}
function playWinSound(){ playTone(660,0.09,'triangle',0.06); setTimeout(()=>playTone(990,0.15,'triangle',0.06),90); }
function playLoseSound(){ playTone(220,0.22,'sawtooth',0.05); }
function playClickSound(){ playTone(440,0.05,'square',0.03); }
let musicNodes=null;
function startAmbientMusic(){
  if(!state||!state.settings.music||musicNodes)return;
  const ctx=getAudioCtx(); if(!ctx)return;
  const osc1=ctx.createOscillator(), osc2=ctx.createOscillator(), gain=ctx.createGain();
  osc1.type='sine'; osc1.frequency.value=110; osc2.type='sine'; osc2.frequency.value=164.81;
  gain.gain.value=0.015;
  osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
  osc1.start(); osc2.start();
  musicNodes={osc1,osc2,gain};
}
function stopAmbientMusic(){ if(musicNodes){ try{musicNodes.osc1.stop();musicNodes.osc2.stop();}catch(e){} musicNodes=null; } }

function notify(title,text,icon='🔔',duration=3000){
  const c=document.getElementById('notifications');
  const n=document.createElement('div'); n.className='notification';
  n.innerHTML=`<div class="notif-icon">${icon}</div><div class="notif-content"><div class="notif-title">${escapeHtml(title)}</div><div class="notif-text">${escapeHtml(text)}</div></div>`;
  c.appendChild(n);
  if(['🏆','💰','🎉','📦','🏅','⭐','🎁','👑'].includes(icon))playWinSound();
  else if(['❌','💥','🔒'].includes(icon))playLoseSound();

// ===================== PARTICLES =====================
(function initParticles(){
  const canvas=document.getElementById('particles-canvas');
  const ctx=canvas.getContext('2d');
  let particles=[];
  function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
  resize(); window.addEventListener('resize',resize);
  for(let i=0;i<50;i++){
    particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.5+0.3,dx:(Math.random()-0.5)*0.25,dy:(Math.random()-0.5)*0.25,alpha:Math.random()*0.4+0.08,color:Math.random()>0.5?'#b24bff':'#00e5ff'});
  }
  function animate(){
    if(document.body.classList.contains('reduced-motion')){ ctx.clearRect(0,0,canvas.width,canvas.height); requestAnimationFrame(animate); return; }
    ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>{p.x+=p.dx;p.y+=p.dy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.color;ctx.globalAlpha=p.alpha;ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(animate);}
  animate();
})();

// ===================== QUEST INIT =====================
function initQuests(){
  if(!state)return;
  const now=Date.now();
  const dayStart=new Date().setHours(0,0,0,0);
  const weekStart=new Date(now-(new Date().getDay()*86400000)).setHours(0,0,0,0);
  if(!state.quests.daily.length||state.quests.dailyReset<dayStart){ state.quests.daily=QUESTS_DEF.daily.map(q=>({...q,progress:0,completed:false})); state.quests.dailyReset=dayStart+86400000; }
  if(!state.quests.weekly.length||state.quests.weeklyReset<weekStart){ state.quests.weekly=QUESTS_DEF.weekly.map(q=>({...q,progress:0,completed:false})); state.quests.weeklyReset=weekStart+7*86400000; }
  saveState(state);
}
function checkQuestProgress(type,amount=1){
  if(!state)return; let updated=false;
  [...state.quests.daily,...state.quests.weekly].forEach(q=>{ if(q.completed||q.type!==type)return; q.progress=Math.min(q.progress+amount,q.target); if(q.progress>=q.target){q.completed=true; notify('Задание выполнено!',q.title,'📜',3000);} updated=true; });
  if(updated)saveState(state);
}
function checkAchievements(){
  if(!state)return;
  ACHIEVEMENTS_DEF.forEach(ach=>{ if(state.achievements.includes(ach.id))return; if(ach.cond({...state.stats,level:state.level})){ state.achievements.push(ach.id); addCoins(ach.reward,'achievement'); notify('Достижение разблокировано!',ach.title,'🏆',4000); } });
  saveState(state);
}

function getRandomSkin(caseId){
  const c=CASES.find(x=>x.id===caseId);
  const pool=SKINS_POOL.filter(it=>c.items.includes(it.rarity));
  const weights=pool.map(it=>RARITY[it.rarity].chance);
  const total=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  for(let i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return{...pool[i],uid:Date.now()+'_'+Math.random().toString(36).substr(2,5),float:(Math.random()*0.5).toFixed(3),stattrak:Math.random()>0.85};}
  return{...pool[0],uid:Date.now()+'_'+Math.random().toString(36).substr(2,5),float:(Math.random()*0.5).toFixed(3),stattrak:Math.random()>0.85};
}

  const won=rolls[38]; rolls[38]=won;
  track.innerHTML=rolls.map(it=>`
    <div class="roulette-item ${RARITY[it.rarity].glow}" style="border-color:${RARITY[it.rarity].color}">

  setTimeout(()=>{
    track.style.transition=''; resultDisplay.style.display='block';
    const stattrak=won.stattrak?'<span style="color:#ff3d3d;font-size:0.65rem;font-weight:700;">★ StatTrak™</span>':'';
    resultItem.innerHTML=`
      <div class="case-result">
        <div style="font-size:3.5rem;margin-bottom:0.4rem;">${WEAPONS[won.weapon].icon}</div>
        <div style="font-family:var(--font-skin);font-size:1.1rem;font-weight:700;color:${RARITY[won.rarity].color};text-shadow:0 0 20px ${RARITY[won.rarity].color}55;">${won.name}</div>

        ${stattrak}
        <div style="font-size:0.7rem;color:var(--text-secondary);margin:0.2rem 0;">Float: ${won.float}</div>
        <div style="font-family:var(--font-display);color:var(--accent-gold);font-weight:700;margin-top:0.3rem;">🪙 ${won.value.toLocaleString()}</div>
      </div>

    state.inventory.unshift({...won,favorite:false,equipped:false,acquired:Date.now()});
    if(won.rarity==='covert')state.stats.covertFound++;
    if(won.rarity==='rare')state.stats.rareFound++;
    saveState(state); checkQuestProgress('cases'); checkAchievements();
    notify('Кейс открыт!',`${won.name} (${RARITY[won.rarity].name})`,'📦',4000);
    document.body.classList.add('shake'); setTimeout(()=>document.body.classList.remove('shake'),450);

  },6700);
}

function setInvFilter(f){invFilter=f;renderInvGrid();}
function setInvSort(s){invSort=s;renderInvGrid();}
function renderInvGrid(){
  const grid=document.getElementById('inv-grid'); if(!grid)return;
  let items=[...state.inventory];
  if(invFilter!=='all')items=items.filter(it=>it.rarity===invFilter);
  if(invSort==='newest')items.sort((a,b)=>b.acquired-a.acquired);
  if(invSort==='byValue')items.sort((a,b)=>b.value-a.value);
  if(invSort==='byRarity'){const order={rare:7,contraband:6,covert:5,classified:4,restricted:3,military:2,industrial:1,consumer:0};items.sort((a,b)=>order[b.rarity]-order[a.rarity]);}
  if(!items.length){grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1;"><div class="empty-state-icon">📦</div><p>Нет скинов</p></div>`;return;}

  el.innerHTML=`

      </div>
      <div class="crash-controls">
        <div class="crash-input-group">
          <label>Режим ставок</label>
          <select class="crash-input" id="crash-mode" onchange="updateCrashMode()">
            <option value="1">🟢 Режим 1 — до 1 000 🪙</option>
            <option value="2">🟡 Режим 2 — до 10 000 🪙</option>
            <option value="3">🔴 Режим 3 — до 1 000 000 🪙</option>
          </select>
        </div>
        <div class="crash-input-group">
          <label>Сумма ставки</label>
          <input type="number" class="crash-input" id="crash-bet" value="50" min="1" max="1000" step="1" oninput="validateCrashBet()">
        </div>
        <div class="crash-input-group">

        </div>

      <button class="btn btn-primary" id="crash-btn" style="width:100%;font-size:1rem;padding:0.875rem;" onclick="crashAction()">СТАВКА</button>
      <div class="crash-history" id="crash-history"></div>
    </div>
  `;
  crashGame={running:false,multiplier:1,bet:0,history:state.stats.crashHistory||[],mode:1,maxBet:1000};
  updateCrashMode();
  renderCrashHistory();
}
function getCrashModeConfig(){
  const mode=parseInt(document.getElementById('crash-mode')?.value)||1;
  const configs={
    1:{maxBet:1000,label:'Режим 1',desc:'До 1 000 🪙 за раунд'},
    2:{maxBet:10000,label:'Режим 2',desc:'До 10 000 🪙 за раунд'},
    3:{maxBet:50000,label:'Режим 3',desc:'До 50 000 🪙 за раунд'}
  };
  return configs[mode]||configs[1];
}
function updateCrashMode(){
  const cfg=getCrashModeConfig();
  const bet=document.getElementById('crash-bet');
  const info=document.getElementById('crash-mode-info');
  if(bet){bet.max=cfg.maxBet;if(parseInt(bet.value)>cfg.maxBet)bet.value=cfg.maxBet;}
  if(info)info.textContent=cfg.desc+'. Момент краша случаен с первой секунды раунда.';
  if(crashGame){crashGame.mode=parseInt(document.getElementById('crash-mode')?.value)||1;crashGame.maxBet=cfg.maxBet;}
}
function validateCrashBet(){
  const cfg=getCrashModeConfig(), input=document.getElementById('crash-bet');
  if(!input)return;
  let bet=parseInt(input.value)||0;
  if(bet<1)bet=1;
  if(bet>cfg.maxBet)bet=cfg.maxBet;
  input.value=bet;
}
function renderCrashHistory(){
  const h=document.getElementById('crash-history'); if(!h)return;
  h.innerHTML=crashGame.history.slice(0,15).map(m=>`<span class="crash-history-item ${m>=1?'win':'loss'}">${m.toFixed(2)}x</span>`).join('');
}
function crashAction(){
  const btn=document.getElementById('crash-btn');
  if(crashGame.running){
    const win=Math.floor(crashGame.bet*crashGame.multiplier);
    addCoins(win-crashGame.bet,'crash'); crashGame.running=false;
    crashGame.history.unshift(crashGame.multiplier); state.stats.crashHistory=crashGame.history;
    if(crashGame.multiplier>state.stats.highCrash)state.stats.highCrash=crashGame.multiplier;
    saveState(state); btn.textContent='СТАВКА'; btn.className='btn btn-primary';
    document.getElementById('crash-multiplier').textContent=crashGame.multiplier.toFixed(2)+'x';
    document.getElementById('crash-multiplier').style.color='var(--accent-green)';
    notify('Вы выиграли!',`+${win-crashGame.bet} 🪙 (${crashGame.multiplier.toFixed(2)}x)`,'💰');
    trackGameResult(true); renderCrashHistory(); return;
  }
  const cfg=getCrashModeConfig();
  const bet=parseInt(document.getElementById('crash-bet').value)||0;
  if(bet<1||bet>cfg.maxBet){notify('Неверная ставка',`Лимит ${cfg.maxBet.toLocaleString('ru-RU')} 🪙`,'❌');return;}
  if(state.coins<bet){notify('Недостаточно монет','','❌');return;}
  state.coins-=bet; saveState(state); updateHeader();
  crashGame.running=true; crashGame.bet=bet; crashGame.multiplier=1.0;
  crashGame.mode=parseInt(document.getElementById('crash-mode').value)||1; crashGame.maxBet=cfg.maxBet;
  btn.textContent='ЗАБРАТЬ'; btn.className='btn btn-success';

  // Точка краша случайна с самого начала раунда (как в честном crash-игре),
  // с преимуществом дома ~4%. Формула: crashPoint = (1-houseEdge) / (1 - r).
  const houseEdge=0.04;
  const r=Math.random();
  let crashPoint=Math.floor(((1-houseEdge)/(1-r))*100)/100;
  crashPoint=Math.min(Math.max(crashPoint,1.00),50);
  const autoCollect=Math.max(0,parseFloat(document.getElementById('crash-auto').value)||0);
  const polyline=document.getElementById('crash-polyline');
  const multEl=document.getElementById('crash-multiplier');
  const svg=document.getElementById('crash-svg');
  let points=[{x:0,y:280}]; let startTime=Date.now();
  function updateCrash(){
    if(!crashGame.running)return;
    // Игрок ушёл со страницы во время раунда — прекращаем цикл, чтобы не обращаться к удалённым DOM-узлам.
    if(!document.getElementById('crash-multiplier')){crashGame.running=false;return;}
    const elapsed=(Date.now()-startTime)/1000;
    crashGame.multiplier=1+elapsed*(0.5+elapsed*0.12);
    multEl.textContent=crashGame.multiplier.toFixed(2)+'x';
    const w=svg.clientWidth||680; const h=280;
    const x=Math.min(elapsed*35,w); const y=h-Math.min((crashGame.multiplier-1)*25,h-10);
    points.push({x,y}); if(points.length>120)points=points.slice(-120);
    polyline.setAttribute('points',points.map(p=>`${p.x},${p.y}`).join(' '));
    if(autoCollect>0&&crashGame.multiplier>=autoCollect){crashAction();return;}
    if(crashGame.multiplier>=crashPoint){
      crashGame.running=false; crashGame.history.unshift(0); state.stats.crashHistory=crashGame.history; saveState(state);
      multEl.textContent='КРАШ!'; multEl.classList.add('crashed');
      btn.textContent='СТАВКА'; btn.className='btn btn-primary'; btn.disabled=true;
      setTimeout(()=>{btn.disabled=false;multEl.classList.remove('crashed');},1500);
      notify('Краш!',`${crashGame.multiplier.toFixed(2)}x`,'💥'); trackGameResult(false); renderCrashHistory(); return;
    }
    requestAnimationFrame(updateCrash);
  }
  requestAnimationFrame(updateCrash);
}

      <button class="btn btn-primary" id="race-btn" style="width:100%;" onclick="startRaceRound()">СТАВКА</button>

    </div>
  `;
  raceGame={selected:null,running:false};

function selectRaceColor(color){ if(raceGame.running)return; raceGame.selected=color; document.querySelectorAll('.race-bet-btn').forEach(b=>b.classList.remove('selected')); document.getElementById('bet-'+color).classList.add('selected'); }
function startRaceRound(){
  if(raceGame.running)return; if(!raceGame.selected){notify('Выберите цвет','','❌');return;}
  const bet=parseInt(document.getElementById('race-bet').value)||0;
  if(bet<1||state.coins<bet){notify('Недостаточно монет','','❌');return;}
  state.coins-=bet; saveState(state); updateHeader();
  raceGame.running=true; document.getElementById('race-btn').disabled=true;
  const colors=['red','blue','green','yellow']; const progress={red:0,blue:0,green:0,yellow:0}; const speeds={red:0,blue:0,green:0,yellow:0}; let winner=null;
  function updateRace(){ if(winner)return; if(!document.getElementById('race-red')){raceGame.running=false;return;} colors.forEach(c=>{speeds[c]+=(Math.random()-0.38)*2.2; speeds[c]=Math.max(0.25,Math.min(3.2,speeds[c])); progress[c]+=speeds[c]; document.getElementById('race-'+c).style.width=Math.min(progress[c],100)+'%'; if(progress[c]>=100&&!winner)winner=c;}); if(!winner)requestAnimationFrame(updateRace); else finishRace(winner,bet); }
  requestAnimationFrame(updateRace);
}
function finishRace(winner,bet){
  raceGame.running=false; const won=winner===raceGame.selected;
  const resultEl=document.getElementById('race-result');
  if(won){const prize=Math.floor(bet*3.5); addCoins(prize,'race'); state.stats.raceWins++; resultEl.innerHTML=`<span style="color:var(--accent-green);">🏆 Вы выиграли +${prize} 🪙</span>`; notify('Вы выиграли!',`+${prize} 🪙`,'🏆');}
  else{ resultEl.innerHTML=`<span style="color:var(--accent-red);">💥 Вы проиграли (${winner.toUpperCase()})</span>`; notify('Вы проиграли!',winner.toUpperCase(),'💥');}
  document.getElementById('race-btn').disabled=false; document.getElementById('race-btn').textContent='СТАВКА';
  checkQuestProgress('race'); trackGameResult(won);
}

  const botName=BOT_NAMES[Math.floor(Math.random()*BOT_NAMES.length)];
  el.innerHTML=`

      </div>

    </div>
  `;
  battleGame={p1Score:0,p2Score:0,round:0,phase:'countdown',botName};
  setTimeout(()=>{document.getElementById('battle-status').textContent='Соперник найден!'; document.getElementById('p2-avatar').classList.add('active'); setTimeout(startBattleRound,1000);},1500);

function startBattleRound(){ if(battleGame.round>=3){endBattle();return;} battleGame.round++; battleGame.phase='countdown'; const timer=document.getElementById('battle-timer'); const btn=document.getElementById('battle-btn'); const status=document.getElementById('battle-status'); btn.disabled=true; btn.style.background='linear-gradient(135deg,var(--accent-purple),var(--accent-pink))'; btn.textContent='ЖДИ ЗЕЛЁНЫЙ'; status.textContent='Готовьтесь...'; let count=3; timer.textContent=count; const cd=setInterval(()=>{count--; timer.textContent=count; if(count<=0){clearInterval(cd); startBattleReaction();}},800); }
function startBattleReaction(){ battleGame.phase='wait'; const btn=document.getElementById('battle-btn'); const status=document.getElementById('battle-status'); const timer=document.getElementById('battle-timer'); timer.textContent='GO!'; status.textContent='Жми когда зелёный!'; const delay=1000+Math.random()*2500; setTimeout(()=>{if(battleGame.phase!=='wait')return; battleGame.phase='active'; battleGame.startTime=Date.now(); btn.disabled=false; btn.style.background='linear-gradient(135deg,#22c55e,#16a34a)'; btn.textContent='CLICK!'; battleGame.botTime=delay+Math.random()*350; setTimeout(()=>{if(battleGame.phase==='active')botBattleClick();},battleGame.botTime);},delay); }
function battleClick(){ if(battleGame.phase!=='active'){ battleGame.phase='done'; document.getElementById('battle-btn').disabled=true; document.getElementById('battle-status').textContent='Слишком рано!'; document.getElementById('p1-score').textContent=--battleGame.p1Score; setTimeout(startBattleRound,1500); return; } battleGame.phase='done'; const reaction=Date.now()-battleGame.startTime; const botReaction=battleGame.botTime; const p1Win=reaction<botReaction; document.getElementById('battle-btn').disabled=true; if(p1Win){battleGame.p1Score++; document.getElementById('p1-score').textContent=battleGame.p1Score; document.getElementById('battle-status').textContent=`Win! ${reaction}ms`;} else{battleGame.p2Score++; document.getElementById('p2-score').textContent=battleGame.p2Score; document.getElementById('battle-status').textContent=`Lost! Bot: ${Math.floor(botReaction)}ms`;} setTimeout(startBattleRound,1500); }
function botBattleClick(){ if(battleGame.phase!=='active')return; battleGame.phase='done'; battleGame.p2Score++; document.getElementById('p2-score').textContent=battleGame.p2Score; document.getElementById('battle-status').textContent='Бот нажал первым!'; document.getElementById('battle-btn').disabled=true; setTimeout(startBattleRound,1500); }
function endBattle(){ const won=battleGame.p1Score>battleGame.p2Score; const resultEl=document.getElementById('battle-result'); const btn=document.getElementById('battle-btn'); btn.style.display='none'; document.getElementById('battle-timer').textContent='РЕЗУЛЬТАТ'; document.getElementById('battle-status').textContent=`${state.nickname} ${battleGame.p1Score} - ${battleGame.p2Score} ${battleGame.botName}`; if(won){const prize=100+state.level*10; addCoins(prize,'battle'); addXP(50); resultEl.innerHTML=`<span style="color:var(--accent-green);">🏆 Вы выиграли +${prize} 🪙 +50 XP</span>`; notify('Вы выиграли!',`+${prize} 🪙`,'🏆');} else{addXP(10); resultEl.innerHTML=`<span style="color:var(--accent-red);">💥 Вы проиграли</span>`; notify('Вы проиграли!','','💥');} trackGameResult(won); setTimeout(()=>{resultEl.innerHTML+=`<br><button class="btn btn-primary" style="margin-top:0.75rem;" onclick="startBattle()">ИГРАТЬ ЕЩЁ</button>`;},500); }

function renderDaily(){
  const el=document.getElementById('main-content');
  const now=Date.now(); const dayStart=new Date().setHours(0,0,0,0);
  const canClaim=now>=state.dailyRewards.lastClaim+86400000;
  const isStreak=now<state.dailyRewards.lastClaim+86400000*2;
  if(!isStreak&&state.dailyRewards.lastClaim>0&&now>state.dailyRewards.lastClaim+86400000*2){state.dailyRewards.streak=0;state.dailyRewards.claimedDays=[];}
  const rewards=[{day:1,icon:'🪙',value:50},{day:2,icon:'🪙',value:75},{day:3,icon:'📦',value:'Кейс Новичок'},{day:4,icon:'🪙',value:100},{day:5,icon:'⭐',value:'50 XP'},{day:6,icon:'🪙',value:150},{day:7,icon:'👑',value:'Кейс Редкость'}];
  el.innerHTML=`<h2 class="section-title">ЕЖЕДНЕВНЫЕ НАГРАДЫ</h2><div class="streak-display"><h3>🔥 ${state.dailyRewards.streak} дней</h3><p style="color:var(--text-secondary);font-size:0.8rem;">Бонус серии активен</p></div><div class="daily-calendar">${rewards.map((r,i)=>{const claimed=state.dailyRewards.claimedDays.includes(i);const available=canClaim&&!claimed&&i===state.dailyRewards.claimedDays.length;return`<div class="day-card ${claimed?'claimed':''} ${available?'available':''}" onclick="${available?'claimDaily('+i+')':''}"><div class="day-number">День ${r.day}</div><div class="day-reward">${r.icon}</div><div class="day-value">${r.value}</div></div>`;}).join('')}</div>`;
}
function claimDaily(index){
  const rewards=[50,75,'case_basic',100,'xp_50',150,'case_premium'];
  const reward=rewards[index]; state.dailyRewards.claimedDays.push(index); state.dailyRewards.lastClaim=Date.now(); state.dailyRewards.streak++;
  if(typeof reward==='number'){const bonus=Math.floor(reward*(1+state.dailyRewards.streak*0.1)); addCoins(bonus,'daily'); notify('Ежедневная награда!',`+${bonus} 🪙`,'📅');}
  else if(reward==='xp_50'){addXP(50); notify('Ежедневная награда!','+50 XP','📅');}
  else if(reward==='case_basic'){const it=getRandomSkin('c1'); state.inventory.unshift({...it,favorite:false,equipped:false,acquired:Date.now()}); notify('Ежедневная награда!',it.name,'📦');}
  else if(reward==='case_premium'){const it=getRandomSkin('c5'); state.inventory.unshift({...it,favorite:false,equipped:false,acquired:Date.now()}); notify('Ежедневная награда!',it.name,'👑');}
  saveState(state); renderDaily(); checkQuestProgress('games');
}

function toggleSetting(key){
  state.settings[key]=!state.settings[key]; saveState(state); renderSettings();
  if(key==='music'){ state.settings.music?startAmbientMusic():stopAmbientMusic(); }
  if(key==='reducedMotion'){ applyReducedMotion(); }
  if(key==='sound'&&state.settings.sound)playClickSound();
}
function applyReducedMotion(){ document.body.classList.toggle('reduced-motion',!!(state&&state.settings.reducedMotion)); }
function activatePromo(){
  const input=document.getElementById('promo-input');
  const code=(input?.value||'').trim().toUpperCase();
  if(!state){notify('Ошибка','Сначала войдите в игру','❌');return;}
  if(!code){notify('Промокод','Введите код','⚠️');return;}
  if(!Array.isArray(state.promoUsed))state.promoUsed=[];
  if(state.promoUsed.includes(code)){notify('Промокод уже использован','Этот код нельзя активировать повторно','❌');return;}
  if(code==='RZDROP222'){

}
async function hashText(text){ const data=new TextEncoder().encode(text); const digest=await crypto.subtle.digest('SHA-256',data); return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function openAdminAuth(){ const modal=document.getElementById('admin-auth-modal'); const input=document.getElementById('admin-password-input'); const err=document.getElementById('admin-login-error'); if(err)err.textContent=''; if(input)input.value=''; modal.classList.add('active'); setTimeout(()=>input&&input.focus(),80); }
function closeAdminAuth(){ document.getElementById('admin-auth-modal').classList.remove('active'); }
async function checkAdminFromProfile(){ const input=document.getElementById('admin-password-input'); const err=document.getElementById('admin-login-error'); const pass=input?input.value:''; if(!pass){err.textContent='Введите пароль';return;} try{ const hash=await hashText(pass); if(hash===ADMIN_PASSWORD_HASH){ adminSession=true; sessionStorage.setItem('riyaz_drop_admin','1'); state.isAdmin=true; saveState(state); closeAdminAuth(); buildNav(); notify('Доступ разрешён!','Админ-панель открыта','🔐',3500); navigate('admin'); } else { err.textContent='Неверный пароль'; if(input){input.value='';input.focus();} } }catch(e){ err.textContent='Ошибка проверки доступа'; } }
function logoutAdmin(){ adminSession=false; sessionStorage.removeItem('riyaz_drop_admin'); if(state){state.isAdmin=false;saveState(state);} buildNav(); notify('Админ','Доступ закрыт','🔒',2500); navigate('profile'); }

function getAllUsers(){
  const users=[];
  if(state)users.push(state);
  // Bot users from market
  const market=getMarketListings();
  const seen=new Set(); if(state)seen.add(state.id);
  for(let i=0;i<8;i++){
    const id='BOT-'+i; if(seen.has(id))continue; seen.add(id);
    users.push({id,nickname:BOT_NAMES[i%BOT_NAMES.length]+'_'+i,level:((i*7)%30)+1,coins:((i*2345)%20000)+500,stats:{casesOpened:(i*11)%50,wins:(i*5)%20,losses:(i*3)%15}});
  }
  return users;
}
